name: Sonar - impacto entre branches

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-branches:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SONAR_HOST_URL: https://sonarcloud.io
      SONAR_PROJECT_KEY: devheloisacabral_PROJETO-FINAL-DE-CONCLUSAO-DE-CURSO-ESPORTIVA-PLUS
      SONAR_ORGANIZATION: devheloisacabral
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_BASE_BRANCH: ${{ github.base_ref }}
      PUSH_AFTER: ${{ github.sha }}
    steps:
      - name: Checkout completo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Configurar JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          java-version: 21
          distribution: zulu
          cache: maven

      - name: Analisar branch base e branch atual
        run: |
          chmod +x scripts/sonar/analyze-commits.sh
          scripts/sonar/analyze-commits.sh

      - name: Publicar resumo da execução
        if: always() && hashFiles('sonar/reports/impacto-branches.md') != ''
        run: cat sonar/reports/impacto-branches.md >> "$GITHUB_STEP_SUMMARY"

      - name: Arquivar evidências
        if: always() && hashFiles('sonar/reports/**') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sonar-impacto-branches-${{ github.run_number }}
          path: sonar/reports/
          retention-days: 90
